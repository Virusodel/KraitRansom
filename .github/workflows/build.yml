name: Build Krait

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install vcpkg and libsodium
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
        .\vcpkg install libsodium:x64-windows-static
        echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" >> $env:GITHUB_ENV
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Build decryptor
      run: |
        cl /O2 /MT /std:c++17 /I vcpkg\installed\x64-windows-static\include decryptor.cpp /link /LIBPATH:vcpkg\installed\x64-windows-static\lib libsodium.lib advapi32.lib user32.lib shell32.lib crypt32.lib ws2_32.lib /OUT:KRAIT_DECRYPTOR.exe
    
    - name: Build resources
      run: |
        rc krait.rc
    
    - name: Build encryptor
      run: |
        cl /O2 /MT /std:c++17 /I vcpkg\installed\x64-windows-static\include encryptor.cpp krait.res /link /LIBPATH:vcpkg\installed\x64-windows-static\lib libsodium.lib advapi32.lib user32.lib shell32.lib crypt32.lib ws2_32.lib /OUT:KRAIT.exe
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Krait
        path: |
          KRAIT.exe
          KRAIT_DECRYPTOR.exe
